appId: com.ffconv.gui
productName: FFConv GUI
asar: true
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - '!**/*.map'
extraResources:
  - from: presets
    to: presets
    filter:
      - '**/*'
  # 自带 ffmpeg/ffprobe（可选）：resources/ffmpeg/ 内有二进制才随包分发，
  # 目录为空时复制 0 个文件、打包照常成功（见 resources/ffmpeg/README.md）
  - from: resources/ffmpeg
    to: ffmpeg
    filter:
      - '**/*'
      - '!**/README.md'
asarUnpack:
  - resources/**
win:
  icon: build/icon.ico
  executableName: FFConv GUI
  target:
    - nsis
    - portable
    - zip
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
portable:
  artifactName: ${productName}-${version}-portable.${ext}
